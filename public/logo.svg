<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="kd-grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B3B32"/>
      <stop offset="100%" stop-color="#16845B"/>
    </linearGradient>
    <linearGradient id="kd-grad-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D07C"/>
      <stop offset="100%" stop-color="#C8A45D"/>
    </linearGradient>
  </defs>
  <!-- Background rounded squircle -->
  <rect x="4" y="4" width="92" height="92" rx="26" fill="url(#kd-grad-bg)" stroke="#C8A45D" stroke-width="2" stroke-opacity="0.4"/>
  <!-- Decorative inner circle pattern -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="url(#kd-grad-gold)" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
  <!-- Golden Award / Shield / Kerala Lottery Symbol -->
  <path d="M50 20 C64 20 72 28 72 44 C72 62 50 78 50 78 C50 78 28 62 28 44 C28 28 36 20 50 20 Z" fill="none" stroke="url(#kd-grad-gold)" stroke-width="2.5"/>
  <!-- Ticket Notch & Star Elements -->
  <path d="M37 38 L63 38 M37 46 L63 46 M37 54 L53 54" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <!-- Center Golden Star Emblem -->
  <polygon points="50,28 52.5,33.5 58,34 54,37.5 55,43 50,40 45,43 46,37.5 42,34 47.5,33.5" fill="url(#kd-grad-gold)"/>
  <!-- Verification Certified Ring Indicator -->
  <circle cx="63" cy="54" r="3" fill="url(#kd-grad-gold)"/>
</svg>
